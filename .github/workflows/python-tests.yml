name: Pallet safety tests

on:
  push:
    branches: [main]
    paths:
      - "pallet_safety/**"
      - "models/**"
      - "tests/**"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r pallet_safety/requirements.txt pytest
      - run: python -m pytest -q tests
