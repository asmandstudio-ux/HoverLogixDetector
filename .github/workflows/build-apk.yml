name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HoverLogixDetect-build${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HoverLogixDetect-apk
          path: HoverLogixDetect-build${{ github.run_number }}.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            "HoverLogixDetect-build${{ github.run_number }}.apk" \
            --title "HoverLogix Detect build ${{ github.run_number }}" \
            --notes "Install on Android 8+ (phone or DJI RC Plus 2). Commit: ${{ github.sha }}" \
            --latest
